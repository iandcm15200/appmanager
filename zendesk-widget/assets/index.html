<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{t "app.name"}}</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <!-- Authentication Modal -->
  <div id="auth-modal" class="modal" style="display: none;">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">{{t "auth.modal_title"}}</h2>
        <p class="modal-description">{{t "auth.modal_description"}}</p>
      </div>
      <form id="auth-form" class="auth-form">
        <div class="form-group">
          <label for="email" class="form-label">{{t "auth.email_label"}}</label>
          <input 
            type="email" 
            id="email" 
            class="form-input" 
            placeholder="{{t 'auth.email_placeholder'}}"
            required
            autocomplete="email"
          >
        </div>
        <div class="form-group">
          <label for="password" class="form-label">{{t "auth.password_label"}}</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="{{t 'auth.password_placeholder'}}"
            required
            autocomplete="current-password"
          >
        </div>
        <button type="submit" id="login-btn" class="btn btn-primary">
          <span class="btn-text">{{t "auth.login_button"}}</span>
          <span class="btn-loader" style="display: none;"></span>
        </button>
      </form>
    </div>
  </div>

  <!-- Main Content -->
  <div id="main-content" style="display: none;">
    <!-- Header -->
    <header class="app-header">
      <h1 class="app-title">{{t "search.header_title"}}</h1>
      <button id="logout-btn" class="btn btn-secondary btn-small">
        {{t "auth.logout_button"}}
      </button>
    </header>

    <!-- Search Status -->
    <div id="search-status" class="search-status" style="display: none;">
      <div class="status-icon"></div>
      <p class="status-text"></p>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
    </div>

    <!-- Results Container -->
    <div id="results-container" style="display: none;">
      <!-- Student Card -->
      <article class="result-card">
        <div class="card-header">
          <h3 class="student-name"></h3>
          <span class="student-id"></span>
        </div>
        <div class="card-body">
          <div class="info-row">
            <span class="info-label">{{t "results.email_label"}}</span>
            <span class="info-value student-email"></span>
          </div>
          <div class="info-row">
            <span class="info-label">{{t "results.phone_label"}}</span>
            <span class="info-value student-phone"></span>
          </div>
          <div class="info-row">
            <span class="info-label">{{t "results.program_label"}}</span>
            <span class="info-value student-program"></span>
          </div>
          <div class="info-row">
            <span class="info-label">{{t "results.registration_label"}}</span>
            <span class="info-value student-registration"></span>
          </div>
          <div class="info-row">
            <span class="info-label">{{t "results.status_label"}}</span>
            <span class="info-value student-status"></span>
          </div>
        </div>
        <div class="card-footer">
          <a 
            href="#" 
            id="apmanager-link" 
            class="btn btn-outline" 
            target="_blank"
            rel="noopener noreferrer"
          >
            {{t "results.view_apmanager"}}
          </a>
          <button id="tipificacion-btn" class="btn btn-primary">
            <span class="btn-text">{{t "results.apply_tipificacion"}}</span>
            <span class="btn-loader" style="display: none;"></span>
          </button>
        </div>
      </article>
    </div>

    <!-- Error Container -->
    <div id="error-container" class="error-card" style="display: none;">
      <div class="error-icon">⚠️</div>
      <h3 class="error-title"></h3>
      <p class="error-message"></p>
      <button id="retry-btn" class="btn btn-secondary">
        {{t "errors.retry_button"}}
      </button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
  <script src="https://static.zdassets.com/zendesk_app_framework_sdk/2.0/zaf_sdk.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
